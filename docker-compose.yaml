# Kör hela appen: frontend (nginx) + backend (FastAPI) + Postgres.
# Lokalt (kräver Docker):  docker compose up --build
# Servern:                 docker compose pull && docker compose up -d
name: kommunkollen

services:
  frontend:
    image: ghcr.io/mattiassjolander/kommunkollen-frontend:${TAG:-latest}
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/mattiassjolander/kommunkollen-backend:${TAG:-latest}
    build: ./backend
    environment: &backend-miljo
      DATABASE_URL: postgresql://${POSTGRES_USER:-kommunkollen}:${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}@db:5432/${POSTGRES_DB:-kommunkollen}
      # Inloggning (se README). Utan GOOGLE_CLIENT_ID är Google-inloggningen avstängd.
      SESSION_SECRET: ${SESSION_SECRET:?Sätt SESSION_SECRET i .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ANVANDARE: ${AUTH_ANVANDARE:-}
      PUBLIK_URL: ${PUBLIK_URL:-}
      ANONYM_LASNING: ${ANONYM_LASNING:-true}
      # true = testinloggning utan lösenord. Aldrig true på en publik server.
      TESTENV: ${TESTENV:-false}
      # Schemalagd insamling (svensk tid). Tomt INSAMLING_DAGAR stänger av schemat.
      INSAMLING_DAGAR: ${INSAMLING_DAGAR-1,15}
      INSAMLING_KLOCKAN: ${INSAMLING_KLOCKAN:-03:00}
      KOLADA_ANROP_PER_SEKUND: ${KOLADA_ANROP_PER_SEKUND:-5}
      SCB_ANROP_PER_SEKUND: ${SCB_ANROP_PER_SEKUND:-2}
      PROTOKOLL_ANROP_PER_SEKUND: ${PROTOKOLL_ANROP_PER_SEKUND:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Schemaläggaren: startar insamlingen enligt schemat. Samma image och miljö som backend.
  insamlare:
    image: ghcr.io/mattiassjolander/kommunkollen-backend:${TAG:-latest}
    build: ./backend
    command: ["/app/.venv/bin/python", "-m", "app.schemalaggare"]
    environment: *backend-miljo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Vektorsökningen (#69) kräver pgvector. Servern byter bild och volym i .env (DB_IMAGE och DB_VOLYM),
  # med säkerhetskopia och återläsning enligt docs/drift.md. Utan pgvector är sökningen enbart fulltext.
  db:
    image: ${DB_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kommunkollen}
      POSTGRES_USER: ${POSTGRES_USER:-kommunkollen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}
    volumes:
      - ${DB_VOLYM:-db-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # Ingen port öppnas: bara backend når databasen via det interna nätverket

volumes:
  db-data:
  db-data-pgvector:
