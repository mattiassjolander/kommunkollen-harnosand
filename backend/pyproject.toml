[project]
name = "kommunkollen"
version = "0.1.0"
description = "Kommunkollen Härnösand – backend (insamling och API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pgserver>=0.1.4",
]

[project.scripts]
kommunkollen-dev = "app.devserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
