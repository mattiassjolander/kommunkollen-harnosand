server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Säkerhetsheaders (ZAP-fynd i #194). Ingen location nedan har egna add_header, så de gäller överallt.
    # Skript, typsnitt och anrop kommer bara från den egna webbplatsen. Vue sätter style-attribut, därför
    # 'unsafe-inline' för stilar men aldrig för skript. Sidan får inte bäddas in i andra webbplatser.
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # API-anrop skickas vidare till backend. Insamlingar kan ta en stund.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sökningen (#142): sökfrågorna loggas inte, så adressen med frågan skrivs inte i åtkomstloggen.
    location /api/sok {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kalenderflödena (ics) och ics-filerna för enskilda sammanträden kommer från backend. Sidan /kalender är Vue.
    location ~ ^/kalender/.+\.ics$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue-routern: okända sökvägar går till index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
