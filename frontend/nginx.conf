server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API-anrop skickas vidare till backend. Insamlingar kan ta en stund.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kalenderflödena (ics) och ics-filerna för enskilda sammanträden kommer från backend. Sidan /kalender är Vue.
    location ~ ^/kalender/.+\.ics$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue-routern: okända sökvägar går till index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
