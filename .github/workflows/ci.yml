name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – söm 1 (API mot Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TESSDATA_PREFIX: /opt/tessdata
      KRAV_OCR: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # OCR för protokoll med bara bilder (#52): Tesseract och svensk språkdata, samma som i imagen.
      - name: Tesseract med svenska
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          sudo mkdir -p /opt/tessdata
          sudo curl -sSL -o /opt/tessdata/swe.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec/swe.traineddata
          echo "360303308aa5d4a912ac3b3637691152b7532d9bd6e960639db1affb83db7ea9  /opt/tessdata/swe.traineddata" | sha256sum -c
          tesseract --list-langs | grep -x swe
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    name: Frontend – bygg och söm 2 (e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results

  images:
    name: Bygg och publicera images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kommunkollen-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/kommunkollen-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy till LXC 107
    needs: images
    # Avstängd tills repo-variabeln DEPLOY_ENABLED = true (Settings → Variables).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, kommunkollen]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docker-compose.yaml
          sparse-checkout-cone-mode: false
      - name: Kopiera compose-filen till servern
        run: cp docker-compose.yaml /opt/kommunkollen/docker-compose.yaml
      - name: Hämta nya images och starta om
        working-directory: /opt/kommunkollen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          TAG=${{ github.sha }} docker compose pull
          TAG=${{ github.sha }} docker compose up -d --remove-orphans
      - name: Kontrollera att appen svarar
        run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1/api/halsa
      - name: Städa bort oanvända images
        run: docker image prune -af --filter "until=168h"
